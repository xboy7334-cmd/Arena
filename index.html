<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#140c10" />
<title>Your Choice Family Restaurant — Best restaurant in Haldia</title>
<meta name="description" content="Order biryani, curries, tandoori breads and desserts from Your Choice Family Restaurant, Haldia. ₹40 flat delivery, free self-pickup." />
<link rel="icon" href="https://www.designarena.ai/u/db4c28c5-53fa-43a8-b363-db503fb871ff" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   Design tokens
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
:root{
  --purple:#7C6FE9;
  --purple-2:#A99BF5;
  --green:#34D399;
  --green-d:#059669;
  --amber:#F59E0B;
  --amber-2:#FBBF24;
  --orange:#F97316;
  --coral:#FB7185;
  --pink:#F9A8D4;
  --text:#FFF6EC;
  --muted:#C9B5AA;
  --muted-2:#96807A;
  --glass:rgba(255,255,255,.06);
  --glass-2:rgba(255,255,255,.03);
  --brd:rgba(255,255,255,.10);
  --brd-warm:rgba(249,115,22,.30);
  --r-lg:24px;--r-md:18px;--r-sm:13px;
  --shadow:0 20px 50px rgba(0,0,0,.5);
  --wrap:1180px;
  --ff:'Plus Jakarta Sans','Noto Sans Bengali',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
body{
  font-family:var(--ff);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 620px at 10% -10%, rgba(249,115,22,.22), transparent 62%),
    radial-gradient(880px 520px at 94% 2%, rgba(124,111,233,.20), transparent 64%),
    radial-gradient(900px 720px at 50% 112%, rgba(251,113,133,.16), transparent 62%),
    linear-gradient(180deg,#170e13 0%,#0e090c 55%,#130b10 100%);
  background-attachment:fixed;
}
img{max-width:100%;display:block}
button,input,textarea,select{font-family:inherit}
a{color:inherit;text-decoration:none}
::selection{background:rgba(249,115,22,.35)}
.wrap{width:100%;max-width:var(--wrap);margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Scrollbar */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:20px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:rgba(249,115,22,.4);background-clip:content-box}

/* ============================================================
   Animations
   ============================================================ */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(249,115,22,.55)}50%{box-shadow:0 0 0 12px rgba(249,115,22,0)}}
@keyframes pulseG{0%,100%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}50%{box-shadow:0 0 0 10px rgba(52,211,153,0)}}
@keyframes shimmer{100%{transform:translateX(100%)}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
.page{animation:fadeUp .45s cubic-bezier(.22,1,.36,1) both}

/* ============================================================
   Primitives
   ============================================================ */
.card{
  background:linear-gradient(160deg,rgba(255,255,255,.078),rgba(255,255,255,.026));
  border:1px solid var(--brd);
  border-radius:var(--r-lg);
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
}
.chip{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 13px;border-radius:999px;font-size:.78rem;font-weight:600;
  background:rgba(255,255,255,.055);border:1px solid var(--brd);color:var(--muted);
  white-space:nowrap;
}
.chip.warm{background:linear-gradient(135deg,rgba(251,191,36,.16),rgba(249,115,22,.12));border-color:rgba(249,115,22,.28);color:#FFE2C2}
.chip.green{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.3);color:#B9F6DE}
.chip.purple{background:rgba(124,111,233,.16);border-color:rgba(124,111,233,.34);color:#D9D3FF}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  border:none;cursor:pointer;font-weight:700;border-radius:15px;
  padding:13px 19px;font-size:.92rem;line-height:1;
  transition:transform .16s ease,box-shadow .22s ease,filter .2s ease,background .2s ease;
  -webkit-tap-highlight-color:transparent;
}
.btn-sm{padding:10px 14px;font-size:.82rem;border-radius:12px}
.btn-primary{background:linear-gradient(135deg,#FCD34D,#F97316 58%,#FB7185);color:#2b1206;box-shadow:0 10px 26px rgba(249,115,22,.32)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(249,115,22,.42)}
.btn-primary:active{transform:scale(.975)}
.btn-purple{background:linear-gradient(135deg,#9184F2,#7C6FE9);color:#fff;box-shadow:0 10px 26px rgba(124,111,233,.34)}
.btn-purple:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(124,111,233,.46)}
.btn-green{background:linear-gradient(135deg,#4ADE80,#34D399);color:#052e1c;box-shadow:0 10px 26px rgba(52,211,153,.3)}
.btn-green:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(52,211,153,.42)}
.btn-ghost{background:var(--glass);border:1px solid var(--brd);color:var(--text)}
.btn-ghost:hover{background:rgba(255,255,255,.1);transform:translateY(-1px)}
.btn-block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.link-btn{background:none;border:none;color:var(--purple-2);font-weight:600;cursor:pointer;font-size:.85rem;padding:4px}
.link-btn:hover{color:#fff;text-decoration:underline}
.link-btn:disabled{color:var(--muted-2);cursor:not-allowed;text-decoration:none}

.input,textarea.input,select.input{
  width:100%;background:rgba(255,255,255,.055);border:1px solid var(--brd);
  color:var(--text);border-radius:14px;padding:13px 15px;font-size:.95rem;
  transition:border-color .2s,box-shadow .2s,background .2s;
}
.input::placeholder{color:var(--muted-2)}
.input:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 4px rgba(124,111,233,.18);background:rgba(255,255,255,.075)}
.input.err{border-color:var(--coral);box-shadow:0 0 0 4px rgba(251,113,133,.16)}
select.input{appearance:none;cursor:pointer;padding-right:38px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%23C9B5AA' stroke-width='2' stroke-linecap='round'><path d='M4 6l4 4 4-4'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center}
textarea.input{resize:vertical;min-height:88px}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.err-msg{font-size:.75rem;color:var(--coral);font-weight:600}
.money{font-variant-numeric:tabular-nums}

.sk{position:relative;overflow:hidden;background:rgba(255,255,255,.055);border-radius:14px}
.sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.11),transparent);animation:shimmer 1.4s infinite}

/* ============================================================
   Header
   ============================================================ */
.header{
  position:sticky;top:0;z-index:70;
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  background:linear-gradient(180deg,rgba(20,12,16,.9),rgba(20,12,16,.62));
  border-bottom:1px solid var(--brd);
}
.header-inner{display:flex;align-items:center;gap:12px;height:70px}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:1}
.brand-logo{
  width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none;
  box-shadow:0 0 0 2px rgba(245,158,11,.55),0 8px 22px rgba(249,115,22,.4);
  animation:glow 4.5s ease-in-out infinite;
}
.brand-text{min-width:0}
.brand-name{font-weight:800;font-size:1.06rem;letter-spacing:-.025em;line-height:1.06;white-space:nowrap}
.brand-name .silver{background:linear-gradient(180deg,#FFFFFF,#CFC4BC);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-name .gold{background:linear-gradient(180deg,#FDE68A,#F97316);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-tag{font-size:.63rem;color:var(--muted-2);letter-spacing:.1em;text-transform:uppercase;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-actions{display:flex;align-items:center;gap:9px;flex:none}
.lang-toggle{display:flex;background:rgba(255,255,255,.055);border:1px solid var(--brd);border-radius:999px;padding:3px}
.lang-toggle button{
  border:none;background:transparent;color:var(--muted);font-weight:700;font-size:.76rem;
  padding:7px 11px;border-radius:999px;cursor:pointer;transition:.2s;line-height:1;
}
.lang-toggle button.active{background:linear-gradient(135deg,#FBBF24,#F97316);color:#2b1206;box-shadow:0 4px 12px rgba(249,115,22,.36)}
.cart-btn{position:relative;padding:11px 15px}
.cart-btn-label{display:none}
.badge{
  position:absolute;top:-6px;right:-6px;min-width:21px;height:21px;padding:0 6px;
  border-radius:999px;background:linear-gradient(135deg,#34D399,#059669);color:#04231a;
  font-size:.68rem;font-weight:800;display:grid;place-items:center;
  box-shadow:0 4px 12px rgba(52,211,153,.5);border:2px solid #140c10;
}
@media(min-width:640px){.cart-btn-label{display:inline}}

/* ============================================================
   Hero
   ============================================================ */
.hero{
  position:relative;overflow:hidden;margin:20px 0 24px;padding:26px 22px;
  border-radius:28px;
  background:
    radial-gradient(120% 130% at 0% 0%,rgba(249,115,22,.28),transparent 58%),
    radial-gradient(110% 130% at 100% 10%,rgba(124,111,233,.24),transparent 58%),
    linear-gradient(150deg,rgba(255,255,255,.085),rgba(255,255,255,.02));
  border:1px solid var(--brd);
  backdrop-filter:blur(16px);
  display:grid;gap:22px;
}
@media(min-width:900px){.hero{grid-template-columns:1.4fr .85fr;align-items:center;padding:38px 38px}}
.hero-kicker{display:inline-flex;align-items:center;gap:8px;font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#FFD9A8}
.hero h1{margin:12px 0 12px;font-size:clamp(1.65rem,5.2vw,2.7rem);line-height:1.08;letter-spacing:-.035em;font-weight:800}
.hero h1 em{font-style:normal;background:linear-gradient(120deg,#FCD34D,#F97316 55%,#FB7185);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0 0 18px;color:var(--muted);font-size:.95rem;line-height:1.65;max-width:52ch}
.hero-chips{display:flex;flex-wrap:wrap;gap:8px}
.hero-art{display:flex;justify-content:center;align-items:center;position:relative}
.hero-logo{
  width:min(230px,62vw);border-radius:50%;
  box-shadow:0 0 0 3px rgba(245,158,11,.35),0 30px 70px rgba(249,115,22,.35),0 0 90px rgba(249,115,22,.22);
  animation:floaty 7s ease-in-out infinite;
}
.hero-ring{position:absolute;width:min(280px,74vw);aspect-ratio:1;border-radius:50%;border:1px dashed rgba(249,115,22,.3);animation:spin 26s linear infinite;pointer-events:none}

/* ============================================================
   Toolbar (search + filters)
   ============================================================ */
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:0 0 14px}
.section-head h2{margin:0;font-size:1.3rem;letter-spacing:-.03em;font-weight:800}
.section-head .sub{font-size:.8rem;color:var(--muted-2);margin-top:4px}
.toolbar{display:grid;gap:12px;margin-bottom:20px}
.search-wrap{position:relative;flex:1}
.search-wrap .icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted-2);pointer-events:none}
.search-wrap input{padding-left:44px;padding-right:44px;height:50px;border-radius:16px}
.clear-search{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.08);border:1px solid var(--brd);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.clear-search:hover{background:rgba(251,113,133,.2);color:#fff}
@media(min-width:760px){.toolbar{grid-template-columns:1fr 210px;align-items:center}}

.pills{display:flex;gap:9px;overflow-x:auto;padding:4px 2px 10px;margin:0 -2px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{
  display:inline-flex;align-items:center;gap:7px;flex:none;
  padding:10px 16px;border-radius:999px;cursor:pointer;font-size:.85rem;font-weight:700;
  background:rgba(255,255,255,.05);border:1px solid var(--brd);color:var(--muted);
  transition:transform .16s,background .2s,border-color .2s,color .2s;
  -webkit-tap-highlight-color:transparent;
}
.pill:hover{color:var(--text);border-color:rgba(255,255,255,.22);transform:translateY(-1px)}
.pill.active{
  background:linear-gradient(135deg,rgba(251,191,36,.22),rgba(249,115,22,.18));
  border-color:rgba(249,115,22,.5);color:#FFE6CC;
  box-shadow:0 8px 22px rgba(249,115,22,.2);
}

/* ============================================================
   Product grid & cards
   ============================================================ */
.grid{display:grid;gap:13px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}}
@media(min-width:1080px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}}
.grid-3{display:grid;gap:13px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:720px){.grid-3{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}}

.p-card{
  position:relative;display:flex;flex-direction:column;gap:9px;padding:11px;
  border-radius:20px;cursor:pointer;
  background:linear-gradient(165deg,rgba(255,255,255,.078),rgba(255,255,255,.024));
  border:1px solid var(--brd);
  backdrop-filter:blur(12px);
  transition:transform .24s cubic-bezier(.22,1,.36,1),border-color .24s,box-shadow .24s;
  animation:fadeUp .4s ease both;
  -webkit-tap-highlight-color:transparent;
}
.p-card:hover,.p-card:focus-visible{
  outline:none;transform:translateY(-5px);border-color:var(--brd-warm);
  box-shadow:0 22px 44px rgba(0,0,0,.5),0 0 0 1px rgba(249,115,22,.18);
}
.p-emoji{
  position:relative;height:96px;display:grid;place-items:center;font-size:2.7rem;border-radius:16px;
  background:
    radial-gradient(120% 120% at 22% 0%,rgba(251,191,36,.3),rgba(249,115,22,.14) 46%,rgba(124,111,233,.16));
  border:1px solid rgba(255,255,255,.075);
  overflow:hidden;
}
@media(min-width:720px){.p-emoji{height:118px;font-size:3.2rem}}
.p-emoji .emo{filter:drop-shadow(0 8px 16px rgba(0,0,0,.4))}
.diet{position:absolute;top:8px;left:8px;width:15px;height:15px;border-radius:4px;display:grid;place-items:center;background:rgba(0,0,0,.5);border:1.5px solid var(--green)}
.diet::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--green)}
.diet.nonveg{border-color:#F87171}
.diet.nonveg::after{background:#F87171}
.p-rating{
  position:absolute;top:8px;right:8px;display:inline-flex;align-items:center;gap:3px;
  padding:4px 8px;border-radius:999px;font-size:.68rem;font-weight:800;
  background:rgba(0,0,0,.55);color:#FFE08A;border:1px solid rgba(251,191,36,.3);backdrop-filter:blur(6px);
}
.p-name{margin:1px 0 0;font-size:.94rem;font-weight:700;letter-spacing:-.015em;line-height:1.28;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}
.p-desc{margin:0;font-size:.76rem;line-height:1.5;color:var(--muted-2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.3em}
.p-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:4px}
.p-price{font-weight:800;font-size:1rem;letter-spacing:-.02em}
.p-price small{font-size:.68rem;color:var(--muted-2);font-weight:600;display:block;letter-spacing:0}
.stepper{display:inline-flex;align-items:center;gap:2px;background:linear-gradient(135deg,rgba(251,191,36,.2),rgba(249,115,22,.16));border:1px solid rgba(249,115,22,.4);border-radius:12px;padding:3px}
.stepper button{
  width:27px;height:27px;border-radius:9px;border:none;cursor:pointer;display:grid;place-items:center;
  background:rgba(255,255,255,.1);color:#FFE0BE;transition:.16s;
}
.stepper button:hover{background:rgba(255,255,255,.22);transform:scale(1.06)}
.stepper button:active{transform:scale(.94)}
.stepper span{min-width:22px;text-align:center;font-weight:800;font-size:.86rem;color:#FFE0BE}
.empty-state{padding:56px 20px;text-align:center;display:grid;gap:12px;justify-items:center;color:var(--muted)}
.empty-state .big{font-size:3rem}

/* ============================================================
   Product detail
   ============================================================ */
.detail-grid{display:grid;gap:20px}
@media(min-width:900px){.detail-grid{grid-template-columns:.85fr 1.15fr;align-items:start}}
.detail-art{
  border-radius:26px;min-height:250px;display:grid;place-items:center;font-size:6.5rem;
  background:
    radial-gradient(120% 120% at 25% 0%,rgba(251,191,36,.34),rgba(249,115,22,.16) 48%,rgba(124,111,233,.2));
  border:1px solid var(--brd);
  position:relative;overflow:hidden;
}
@media(min-width:900px){.detail-art{min-height:380px;font-size:9rem;position:sticky;top:92px}}
.detail-title h1{margin:10px 0 10px;font-size:clamp(1.5rem,4.4vw,2.2rem);letter-spacing:-.035em;line-height:1.14;font-weight:800}
.detail-title p{color:var(--muted);line-height:1.7;margin:0 0 18px;font-size:.95rem}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.price-block{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:18px 0 20px}
.price-block .amount{font-size:2rem;font-weight:800;letter-spacing:-.03em}

/* ============================================================
   Cart drawer / scrim / FAB
   ============================================================ */
.scrim{position:fixed;inset:0;background:rgba(8,4,6,.68);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:100}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;z-index:101;right:0;top:0;bottom:0;width:min(430px,100%);
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(28,18,22,.98),rgba(18,11,14,.99));
  border-left:1px solid var(--brd);
  transform:translateX(102%);transition:transform .34s cubic-bezier(.22,1,.36,1);
  box-shadow:-30px 0 70px rgba(0,0,0,.6);
}
.drawer.open{transform:none}
@media(max-width:560px){
  .drawer{top:auto;bottom:0;left:0;right:0;width:100%;height:88vh;border-radius:26px 26px 0 0;border-left:none;border-top:1px solid var(--brd);transform:translateY(102%)}
  .drawer.open{transform:none}
}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 18px 14px;border-bottom:1px solid var(--brd)}
.drawer-head h3{margin:0;font-size:1.05rem;font-weight:800;letter-spacing:-.02em}
.drawer-body{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:11px}
.drawer-foot{padding:16px 18px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--brd);display:grid;gap:12px;background:rgba(0,0,0,.2)}
.cart-line{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:9px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--brd);animation:fadeUp .3s ease both}
.cart-line .emo{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:1.6rem;background:radial-gradient(120% 120% at 20% 0%,rgba(251,191,36,.26),rgba(124,111,233,.18))}
.cart-line .nm{font-weight:700;font-size:.85rem;line-height:1.3}
.cart-line .pr{font-size:.78rem;color:var(--muted);margin-top:3px}
.trash{background:rgba(255,255,255,.06);border:1px solid var(--brd);width:32px;height:32px;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--muted);transition:.2s}

function useI18n() {
  const lang = (uiStore.useStore((s: any) => s.lang) || 'en') as Lang;
  const t = useCallback((key: string) => {
    const dict = I18N[lang] || I18N.en;
    const val = dict[key] != null ? dict[key] : I18N.en[key];
    return val != null ? val : key;
  }, [lang]);
  const setLang = useCallback((l: Lang) => uiStore.setState({ lang: l }), []);
  return { lang, t, setLang, isBn: lang === 'bn' };
}

/* ================================================================
   STORE (Zustand-style, with localStorage persistence)
   ================================================================ */
function createStore(initialState: any, persistKey?: string) {
  let state = { ...initialState };
  if (persistKey) {
    try {
      const raw = localStorage.getItem(persistKey);
      if (raw) state = { ...state, ...JSON.parse(raw) };
    } catch (e) { /* ignore corrupt storage */ }
  }
  const listeners = new Set<() => void>();
  const store: any = {
    getState: () => state,
    setState: (partial: any) => {
      const patch = typeof partial === 'function' ? partial(state) : partial;
      state = { ...state, ...patch };
      if (persistKey) {
        try { localStorage.setItem(persistKey, JSON.stringify(state)); } catch (e) {}
      }
      listeners.forEach((l) => l());
    },
    subscribe: (l: () => void) => { listeners.add(l); return () => { listeners.delete(l); }; },
    useStore: (selector?: (s: any) => any) => {
      const sel = selector || ((s: any) => s);
      return React.useSyncExternalStore(store.subscribe, () => sel(state), () => sel(state));
    },
  };
  return store;
}

const cart = {
  add(id: number) {
    cartStore.setState((s: any) => {
      const exists = s.items.find((i: CartLine) => i.id === id);
      return {
        items: exists
          ? s.items.map((i: CartLine) => (i.id === id ? { ...i, qty: i.qty + 1 } : i))
          : [...s.items, { id, qty: 1 }],
      };
    });
  },
  setQty(id: number, qty: number) {
    cartStore.setState((s: any) => ({
      items: qty <= 0
        ? s.items.filter((i: CartLine) => i.id !== id)
        : s.items.map((i: CartLine) => (i.id === id ? { ...i, qty } : i)),
    }));
  },
  remove(id: number) { cartStore.setState((s: any) => ({ items: s.items.filter((i: CartLine) => i.id !== id) })); },
  clear() { cartStore.setState({ items: [] }); },
};

  } catch (e) {}
  return null;
}

/* ---------- Confetti (canvas, no dependencies) ---------- */
function fireConfetti() {
  const canvas = document.getElementById('confetti') as HTMLCanvasElement | null;
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = window.innerWidth;
  const H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const colors = ['#FBBF24', '#F97316', '#FB7185', '#F9A8D4', '#7C6FE9', '#34D399', '#FFF6EC'];
  const parts: any[] = [];
  for (let i = 0; i < 170; i++) {
    parts.push({
      x: W * (0.2 + Math.random() * 0.6),
      y: H * (0.3 + Math.random() * 0.12),
      vx: (Math.random() - 0.5) * 13,
      vy: Math.random() * -12 - 2.5,
      g: 0.26 + Math.random() * 0.16,
      s: 5 + Math.random() * 8,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.32,
      shape: Math.random() > 0.45 ? 'rect' : 'circle',
    });
  }
  const start = performance.now();
  function frame(now: number) {
    const elapsed = now - start;
    ctx.clearRect(0, 0, W, H);
    const alpha = elapsed > 2600 ? Math.max(0, 1 - (elapsed - 2600) / 1000) : 1;
    parts.forEach((p) => {
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.995;
      p.rot += p.vr;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.shape === 'rect') ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.62);
      else { ctx.beginPath(); ctx.arc(0, 0, p.s * 0.44, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    });
    if (elapsed < 3600) requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, W, H);
  }
  requestAnimationFrame(frame);
}

/* ================================================================
   API LAYER + MOCK BACKEND
   ================================================================ */
async function request(path: string, opts: any = {}) {
  const { method = 'GET', body, timeout = 8000 } = opts;
  if (!CONFIG.API_URL) throw new Error('no-api');
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeout);
  try {
    const res = await fetch(CONFIG.API_URL + path, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
      signal: ctrl.signal,
    });
    if (!res.ok) {
      const err: any = new Error('HTTP ' + res.status);
      err.status = res.status;
      throw err;
    }
    metaStore.setState({ source: 'api' });
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

async function withApi(path: string, opts: any, fallback: () => Promise<any>) {
  if (!CONFIG.API_URL) {
    metaStore.setState({ source: 'demo' });
    return fallback();
  }
  try {
    return await request(path, opts);
  } catch (err: any) {
    // Real client errors (4xx) bubble up so validation messages surface.
    if (err && err.status && err.status >= 400 && err.status < 500) throw err;
    metaStore.setState({ source: 'demo' });
    return fallback();
  }
}

    return { order_ref: ref, otp_sent: true, demo_otp: '123456', status: 'pending_otp' };
  },
  async verifyOtp(payload: { order_ref: string; otp: string }) {
    await sleep(750);
    const all = Mock.read();
    const o = all[payload.order_ref];
    if (!o) throw new Error('Order not found');
    if (String(payload.otp) !== String(o.otp)) throw new Error('Invalid OTP');
    o.verifiedAt = Date.now();
    all[payload.order_ref] = o;
    Mock.write(all);
    return { order_ref: payload.order_ref, status: 'accepted', verified: true };
  },
  async resendOtp(payload: { order_ref: string }) {
    await sleep(550);
    return { order_ref: payload.order_ref, otp_sent: true, demo_otp: '123456' };
  },
  async track(order_ref: string) {
    await sleep(320);
    const all = Mock.read();
    const o = all[order_ref];
    if (!o) throw new Error('Order not found');
    const now = Date.now();
    if (o.paidAt && !o.shippedAt && now - o.paidAt > 6000) o.shippedAt = now;
    if (o.shippedAt && !o.deliveredAt && now - o.shippedAt > 14000) o.deliveredAt = now;
    all[order_ref] = o;
    Mock.write(all);
    const status: OrderStatus = !o.verifiedAt ? 'pending_otp'
      : o.deliveredAt ? 'delivered'
      : o.shippedAt ? 'shipped'
      : o.paidAt ? 'paid' : 'accepted';
    return {
      order_ref,
      status,
      total: o.total,
      mode: o.mode,
      created_at: o.created_at,
      timestamps: {
        verified: o.verifiedAt || null,
        accepted: o.verifiedAt || null,
        paid: o.paidAt || null,
        shipped: o.shippedAt || null,
        delivered: o.deliveredAt || null,
      },
      shipping: o.shippedAt ? {
        courier: 'Your Choice Express',
        awb: 'YCE' + o.ref,
        address: o.mode === 'pickup' ? CONFIG.ADDRESS : 'Your address, Haldia',
        eta: o.deliveredAt ? 'Delivered' : '18–24 min',
      } : null,
    };
  },
  async pay(order_ref: string) {
    await sleep(950);
    const all = Mock.read();
    const o = all[order_ref];
    if (!o) throw new Error('Order not found');
    if (!o.verifiedAt) throw new Error('Order not verified');
    o.paidAt = Date.now();
    all[order_ref] = o;
    Mock.write(all);
    return { order_ref, status: 'paid', payment_ref: 'PAY' + Math.floor(Math.random() * 999999) };
  },
};

/* ================================================================
   ROUTER (hash based, lazy routes)
   ================================================================ */
function navigate(to: string) {
  if (('#' + to) === window.location.hash) return;
  window.location.hash = to;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function useHashRoute() {
  const [hash, setHash] = useState(() => window.location.hash || '#/');
  useEffect(() => {
    const onChange = () => setHash(window.location.hash || '#/');
    window.addEventListener('hashchange', onChange);
    return () => window.removeEventListener('hashchange', onChange);
  }, []);
  const path = (hash || '#/').replace(/^#/, '') || '/';
  const parts = path.split('/').filter(Boolean);
  return { path, parts };
}

/* ================================================================
   HOOKS
   ================================================================ */
function useCatalog() {
  const loading = catalogStore.useStore((s: any) => s.loading);
  const products = catalogStore.useStore((s: any) => s.products);
  return { loading, products: products as Product[] };
}

function useCartLines() {
  const items = cartStore.useStore((s: any) => s.items) as CartLine[];
  const products = catalogStore.useStore((s: any) => s.products) as Product[];
  return useMemo(() => {
    const lines = items
      .map((i) => {
        const p = products.find((x) => x.id === i.id);
        return p ? { ...p, qty: i.qty } : null;
      })
      .filter(Boolean) as (Product & { qty: number })[];
    const subtotal = lines.reduce((a, l) => a + l.price * l.qty, 0);
    const count = lines.reduce((a, l) => a + l.qty, 0);
    return { lines, subtotal, count };
  }, [items, products]);
}

  const [errors, setErrors] = useState<Record<string, string>>({});
  const [placing, setPlacing] = useState(false);

  const deliveryFee = mode === 'delivery' ? CONFIG.DELIVERY_FEE : 0;
  const total = subtotal + deliveryFee;

  const setField = (k: keyof Customer, v: string) => {
    setForm((f) => ({ ...f, [k]: v }));
    setErrors((e) => ({ ...e, [k]: '' }));
  };

  const validate = () => {
    const e: Record<string, string> = {};
    if (!form.name.trim()) e.name = t('errName');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(form.email.trim())) e.email = t('errEmail');
    const digits = form.phone.replace(/\D/g, '');

/* ================================================================
   PAGE: OTP VERIFICATION
   ================================================================ */
function VerifyPage({ orderRef }: { orderRef: string }) {
  const { t } = useI18n();
  const [digits, setDigits] = useState<string[]>(['', '', '', '', '', '']);
  const [busy, setBusy] = useState(false);
  const [shake, setShake] = useState(false);
  const [cooldown, setCooldown] = useState(30);
  const [demoOtp, setDemoOtp] = useState<string | null>(null);
  const refs = useRef<Array<HTMLInputElement | null>>([]);
  const snap = useMemo(() => getSnapshot(orderRef), [orderRef]);

  useEffect(() => {
    refs.current[0]?.focus();
    if (snap && snap.demo_otp) setDemoOtp(snap.demo_otp);
  }, [snap]);

  useEffect(() => {
    if (cooldown <= 0) return;
    const id = setInterval(() => setCooldown((c) => (c <= 1 ? 0 : c - 1)), 1000);
    return () => clearInterval(id);
  }, [cooldown]);

  const maskedPhone = snap && snap.customer && snap.customer.phone
    ? '+91 •••• ••' + snap.customer.phone.slice(-4)
    : '+91 •••• ••••';

  const setDigit = (i: number, val: string) => {
    const v = val.replace(/\D/g, '').slice(-1);
    setDigits((d) => {
      const next = [...d];
      next[i] = v;
      return next;
    });
    if (v && i < 5) refs.current[i + 1]?.focus();
  };

  const onKeyDown = (i: number, e: React.KeyboardEvent<HTMLInputElement>) => {
    if (e.key === 'Backspace') {
      if (digits[i]) {
        setDigits((d) => { const n = [...d]; n[i] = ''; return n; });
      } else if (i > 0) {
        refs.current[i - 1]?.focus();
        setDigits((d) => { const n = [...d]; n[i - 1] = ''; return n; });
      }
      e.preventDefault();
    }
    if (e.key === 'ArrowLeft' && i > 0) refs.current[i - 1]?.focus();
    if (e.key === 'ArrowRight' && i < 5) refs.current[i + 1]?.focus();
    if (e.key === 'Enter') submit();
  };

  const onPaste = (e: React.ClipboardEvent) => {
    e.preventDefault();
    const text = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
    if (!text) return;
    const next = ['', '', '', '', '', ''];
    text.split('').forEach((ch, idx) => { next[idx] = ch; });
    setDigits(next);
    refs.current[Math.min(text.length, 5)]?.focus();
  };

  const fail = () => {
    setShake(true);
    setTimeout(() => setShake(false), 600);
    toast(t('otpErr'), 'error');
    setDigits(['', '', '', '', '', '']);
    refs.current[0]?.focus();
  };

  async function submit() {
    const otp = digits.join('');
    if (otp.length !== 6) { toast(t('needOtp'), 'error'); return; }
    setBusy(true);
    try {
      await api.verifyOtp({ order_ref: orderRef, otp });
      toast(t('verifiedToast'), 'success');
      navigate('/track/' + orderRef);
    } catch (err) {
      fail();
    } finally {
      setBusy(false);
    }
  }

  async function resend() {
    if (cooldown > 0) return;
    setCooldown(30);
    try {
      const res: any = await api.resendOtp({ order_ref: orderRef });
      if (res && (res.demo_otp || res.otp)) setDemoOtp(res.demo_otp || res.otp);
      toast(t('resendToast'), 'success');
      refs.current[0]?.focus();
    } catch (e) {
      toast('Could not resend the code. Try again.', 'error');
    }
  }

  return (
    <div className="page wrap" style={{ paddingTop: 30, paddingBottom: 30 }}>
      <div className="narrow card" style={{ padding: 24 }}>
        <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 6 }}>
          <div style={{ width: 76, height: 76, borderRadius: 22, display: 'grid', placeItems: 'center', background: 'linear-gradient(135deg,rgba(124,111,233,.28),rgba(249,115,22,.2))', border: '1px solid rgba(124,111,233,.35)', color: '#D9D3FF' }}>
            <Icon name="shield" size={34} sw={1.6} />
          </div>
        </div>
        <h2 style={{ textAlign: 'center', margin: '10px 0 6px', fontSize: '1.45rem', letterSpacing: '-.03em', fontWeight: 800 }}>{t('verifyTitle')}</h2>
        <p style={{ textAlign: 'center', color: 'var(--muted)', fontSize: '.87rem', margin: 0 }}>
          {t('verifySub')} <strong style={{ color: 'var(--text)' }}>{maskedPhone}</strong>
        </p>
        <div style={{ display: 'flex', justifyContent: 'center', marginTop: 10 }}>
          <span className="chip purple"><Icon name="cart" size={13} /> {t('orderRef')}: {orderRef}</span>
        </div>

        <div className={'otp-row' + (shake ? ' shake' : '')} onPaste={onPaste}>
          {digits.map((d, i) => (
            <input
              key={i}
              ref={(el) => { refs.current[i] = el; }}
              className={'otp-in' + (d ? ' filled' : '')}
              value={d}
              onChange={(e) => setDigit(i, e.target.value)}
              onKeyDown={(e) => onKeyDown(i, e)}
              inputMode="numeric"
              autoComplete="one-time-code"
              maxLength={1}
              aria-label={'Digit ' + (i + 1)}
            />
          ))}
        </div>

        {demoOtp ? (
          <div className="hint-box" style={{ marginBottom: 16 }}>
            <Icon name="sparkles" size={16} />
            <span>{t('otpHint')} <strong>{demoOtp}</strong></span>
          </div>
        ) : null}

        <button className="btn btn-primary btn-block" onClick={submit} disabled={busy || digits.join('').length !== 6}>
          {busy ? (
            <><span style={{ width: 15, height: 15, border: '2px solid rgba(0,0,0,.35)', borderTopColor: '#2b1206', borderRadius: '50%', display: 'inline-block', animation: 'spin .7s linear infinite' }} /> {t('verifying')}</>
          ) : (
            <>{t('verify')} <Icon name="arrowRight" size={17} /></>
          )}
        </button>

        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: 16, flexWrap: 'wrap', gap: 8 }}>
          <button className="link-btn" onClick={() => navigate('/checkout')}>{t('backToCheckout')}</button>
          <button className="link-btn" onClick={resend} disabled={cooldown > 0}>
            {cooldown > 0 ? t('resendIn') + ' ' + cooldown + 's' : t('resend')}
          </button>
        </div>
      </div>
    </div>
  );
}

const STEPS = [

  { key: 'accepted', titleKey: 'stepAccepted', subKey: 'stepAcceptedSub', icon: 'check', reachedBy: ['accepted', 'paid', 'shipped', 'delivered'] },
  { key: 'paid', titleKey: 'stepPaid', subKey: 'stepPaidSub', icon: 'wallet', reachedBy: ['paid', 'shipped', 'delivered'] },
  { key: 'shipped', titleKey: 'stepShipped', subKey: 'stepShippedSub', icon: 'truck', reachedBy: ['shipped', 'delivered'] },
  { key: 'delivered', titleKey: 'stepDelivered', subKey: 'stepDeliveredSub', icon: 'party', reachedBy: ['delivered'] },

function TrackPage({ orderRef }: { orderRef: string }) {
  const { t, lang } = useI18n();
  const [data, setData] = useState<any>(null);
  const [error, setError] = useState<string | null>(null);
  const [paying, setPaying] = useState(false);
  const [tick, setTick] = useState(0);
  const snap = useMemo(() => getSnapshot(orderRef), [orderRef]);

  useEffect(() => {
    let alive = true;
    let timer: any;
    async function poll() {
      try {
        const d: any = await api.track(orderRef);
        if (!alive) return;
        setData(d);
        setError(null);
        if (d.status !== 'delivered') timer = setTimeout(poll, 4000);
      } catch (e: any) {
        if (!alive) return;
        setError(e && e.message ? e.message : 'Order not found');
        timer = setTimeout(poll, 6000);
      }
    }
    poll();
    return () => { alive = false; clearTimeout(timer); };
  }, [orderRef, tick]);

  const status: OrderStatus = (data && data.status) || 'pending_otp';

  const statusLabel: Record<string, string> = {
    pending_otp: t('statusPending'),
    accepted: t('statusAccepted'),
    paid: t('statusPaid'),
    shipped: t('statusShipped'),
    delivered: t('statusDelivered'),
  };

  const handlePay = async () => {
    setPaying(true);
    try {
      await api.pay(orderRef);
      fireConfetti();
      toast(t('paidToast'), 'success');
      setTick((x) => x + 1);
    } catch (e: any) {
      toast(e && e.message ? e.message : 'Payment failed. Please try again.', 'error');
    } finally {
      setPaying(false);
    }
  };

  const total = (data && data.total) || (snap && snap.total) || 0;
  const items = (snap && snap.items) || [];

  if (error && !data) {
    return (
      <div className="page wrap" style={{ paddingTop: 30 }}>
        <div className="empty-state card">
          <span className="big">🔍</span>
          <strong style={{ color: 'var(--text)' }}>{error}</strong>
          <span>{t('orderRef')}: {orderRef}</span>
          <button className="btn btn-primary btn-sm" onClick={() => navigate('/')}>{t('newOrder')}</button>
        </div>
      </div>
    );
  }

  return (
    <div className="page wrap" style={{ paddingTop: 24, paddingBottom: 24 }}>
      <div className="section-head">
        <div>
          <h2>{t('trackTitle')}</h2>
          <div className="sub">{t('orderRef')} · {orderRef}</div>
        </div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <button className="btn btn-ghost btn-sm" onClick={() => setTick((x) => x + 1)}>
            <Icon name="refresh" size={15} /> {t('refresh')}
          </button>
          <button className="btn btn-primary btn-sm" onClick={() => navigate('/')}>{t('newOrder')}</button>
        </div>
      </div>

      <div className="checkout-grid">
        <div style={{ display: 'grid', gap: 18 }}>
          <div className="card" style={{ padding: 20 }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap', marginBottom: 20 }}>
              <div>
                <div style={{ fontSize: '.72rem', letterSpacing: '.14em', textTransform: 'uppercase', color: 'var(--muted-2)' }}>{t('status')}</div>
                <div style={{ fontSize: '1.3rem', fontWeight: 800, letterSpacing: '-.03em', marginTop: 4 }}>{statusLabel[status]}</div>
              </div>
              <span className={'status-pill ' + (status === 'pending_otp' ? 'pending' : status)}>
                <span className="dot-live" /> {status === 'delivered' ? t('stepDelivered') : status === 'shipped' ? t('stepShipped') : status === 'paid' ? t('stepPaid') : status === 'accepted' ? t('stepAccepted') : t('statusPending')}
              </span>
            </div>

            <div className="timeline">
              {STEPS.map((s, idx) => {
                const done = s.reachedBy.indexOf(status) >= 0;
                const isLastDone = done && (idx === STEPS.length - 1 || STEPS[idx + 1].reachedBy.indexOf(status) < 0);
                const ts = data && data.timestamps ? data.timestamps[s.key] : null;
                return (
                  <div className={'tl-item' + (done ? ' done' : '') + (isLastDone && status !== 'delivered' ? ' active' : '')} key={s.key}>
                    <div className="tl-dot"><Icon name={s.icon} size={18} /></div>
                    <div className="tl-body">
                      <div className="tl-title">{t(s.titleKey)}</div>
                      <div className="tl-sub">
                        {t(s.subKey)}
                        {ts ? ' · ' + new Date(ts).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) : ''}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>

            {status === 'pending_otp' ? (
              <div className="hint-box" style={{ marginTop: 18 }}>
                <Icon name="shield" size={16} />
                <span>{t('verifyNow')}</span>
                <button className="link-btn" style={{ marginLeft: 'auto' }} onClick={() => navigate('/verify/' + orderRef)}>
                  {t('verify')}
                </button>
              </div>
            ) : (
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 18, color: 'var(--muted-2)', fontSize: '.76rem' }}>
                <span className="dot-live" style={{ background: 'var(--green)' }} /> {t('autoRefresh')}
              </div>
            )}
          </div>

          {status === 'accepted' ? (
            <div className="card pay-card" style={{ padding: 20 }}>
              <h3 style={{ margin: '0 0 6px', fontSize: '1.05rem', fontWeight: 800, letterSpacing: '-.02em' }}>{t('paymentTitle')}</h3>
              <p style={{ margin: '0 0 16px', color: 'var(--muted)', fontSize: '.85rem' }}>{t('paymentSub')}</p>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap' }}>
                <div>
                  <div style={{ fontSize: '.72rem', color: 'var(--muted-2)', textTransform: 'uppercase', letterSpacing: '.12em' }}>{t('total')}</div>
                  <div style={{ fontSize: '1.7rem', fontWeight: 800, letterSpacing: '-.03em' }} className="money">{money(total)}</div>
                </div>
                <button className="btn btn-green" style={{ minWidth: 190 }} onClick={handlePay} disabled={paying}>
                  {paying ? (
                    <><span style={{ width: 15, height: 15, border: '2px solid rgba(5,46,28,.35)', borderTopColor: '#052e1c', borderRadius: '50%', display: 'inline-block', animation: 'spin .7s linear infinite' }} /> {t('paying')}</>
                  ) : (
                    <><Icon name="wallet" size={17} /> {t('payNow')} {money(total)}</>
                  )}
                </button>
              </div>
              <div style={{ display: 'flex', gap: 8, marginTop: 14, flexWrap: 'wrap' }}>
                <span className="chip">UPI</span>
                <span className="chip">Credit / Debit</span>
                <span className="chip">Netbanking</span>
                <span className="chip">Cash on delivery</span>
              </div>
            </div>
          ) : null}

          {data && data.shipping ? (
            <div className="card" style={{ padding: 20 }}>
              <h3 style={{ margin: '0 0 12px', fontSize: '1.02rem', fontWeight: 800, letterSpacing: '-.02em', display: 'flex', alignItems: 'center', gap: 9 }}>
                <Icon name="truck" size={18} /> {t('shippingInfo')}
              </h3>
              <div className="info-row"><span className="k">{t('courier')}</span><span className="v">{data.shipping.courier}</span></div>
              <div className="info-row"><span className="k">{t('awb')}</span><span className="v">{data.shipping.awb}</span></div>
              <div className="info-row"><span className="k">{t('address')}</span><span className="v" style={{ maxWidth: '60%' }}>{data.shipping.address}</span></div>
              <div className="info-row">
                <span className="k">{t('eta')}</span>
                <span className="v" style={{ color: data.shipping.eta === 'Delivered' ? 'var(--green)' : '#FFD3A6' }}>{data.shipping.eta}</span>
              </div>
            </div>
          ) : null}
        </div>

        <div className="summary-sticky">
          <div className="card" style={{ padding: 18, display: 'grid', gap: 12 }}>
            <h3 style={{ margin: 0, fontSize: '1rem', fontWeight: 800, letterSpacing: '-.02em' }}>{t('itemsInOrder')}</h3>
            {items.length ? items.map((it: any, i: number) => (
              <div className="mini-line" key={i}>
                <span className="emo">{it.emoji}</span>
                <span className="nm">{it.name}</span>
                <span className="qty">×{it.qty}</span>
                <span className="amt money">{money(it.price * it.qty)}</span>
              </div>
            )) : (
              <div style={{ color: 'var(--muted-2)', fontSize: '.85rem' }}>{t('loading')}</div>
            )}
            <div className="totals">
              {snap ? (
                <>
                  <div className="row"><span>{t('subtotal')}</span><span className="money" style={{ color: 'var(--text)', fontWeight: 700 }}>{money(snap.subtotal)}</span></div>
                  <div className="row"><span>{snap.mode === 'pickup' ? t('selfPickup') : t('delivery')}</span><span className="money" style={{ color: snap.delivery_fee === 0 ? 'var(--green)' : 'var(--text)', fontWeight: 700 }}>{snap.delivery_fee === 0 ? t('free') : money(snap.delivery_fee)}</span></div>
                </>
              ) : null}
              <div className="row grand"><span>{t('total')}</span><span className="money">{money(total)}</span></div>
            </div>
            {snap ? (
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                <span className="chip warm"><Icon name={snap.mode === 'pickup' ? 'pin' : 'truck'} size={13} />{snap.mode === 'pickup' ? t('pickup') : t('delivery')}</span>
                <span className="chip"><Icon name="phone" size={13} />{snap.customer ? '···' + snap.customer.phone.slice(-4) : ''}</span>
              </div>
            ) : null}
            <button className="btn btn-ghost btn-block" onClick={() => navigate('/')}>
              <Icon name="sparkles" size={16} /> {t('orderMore')}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ================================================================
   FOOTER
   ================================================================ */
function Footer() {
  const { t } = useI18n();
  const source = metaStore.useStore((s: any) => s.source);
  const [showConfig, setShowConfig] = useState(false);
  const [url, setUrl] = useState(localStorage.getItem('yc_api_url') || '');

  const saveUrl = () => {
    const clean = url.trim().replace(/\/+$/, '');
    if (clean) localStorage.setItem('yc_api_url', clean);
    else localStorage.removeItem('yc_api_url');
    toast(clean ? 'API endpoint saved. Reloading…' : 'Reset to demo data. Reloading…', 'success');
    setTimeout(() => window.location.reload(), 700);
  };

  return (
    <footer className="footer">
      <div className="wrap">
        <div className="footer-inner">
          <div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 11, marginBottom: 12 }}>
              <img src={LOGO} alt="" style={{ width: 42, height: 42, borderRadius: '50%', boxShadow: '0 0 0 2px rgba(245,158,11,.5)' }} />
              <div>
                <div className="brand-name"><span className="silver">Your</span> <span className="gold">Choice</span></div>
                <div className="brand-tag">{t('tagline')}</div>
              </div>
            </div>
            <p>{t('hours')}</p>
            <p style={{ marginTop: 8 }}>{CONFIG.ADDRESS}</p>
            <div style={{ display: 'flex', gap: 8, marginTop: 14, flexWrap: 'wrap' }}>
              <span className={'chip ' + (source === 'api' ? 'green' : 'purple')}>
                <Icon name={source === 'api' ? 'check' : 'sparkles'} size={13} />
                {source === 'api' ? t('liveApi') : t('demoData')}
              </span>
              <button className="chip" onClick={() => setShowConfig((s) => !s)} style={{ cursor: 'pointer', fontFamily: 'inherit' }}>
                <Icon name="refresh" size={13} /> {t('apiConfig')}
              </button>
            </div>
            {showConfig ? (
              <div className="api-box">
                <div style={{ fontSize: '.75rem', color: 'var(--muted-2)', lineHeight: 1.6 }}>{t('apiConfigSub')}</div>
                <div className="row">
                  <input
                    className="input"
                    style={{ padding: '10px 12px', fontSize: '.82rem' }}
                    value={url}
                    onChange={(e) => setUrl(e.target.value)}
                    placeholder="https://api.yourchoice.example"
                  />
                  <button className="btn btn-primary btn-sm" onClick={saveUrl}>{t('save')}</button>
                </div>
              </div>
            ) : null}
          </div>
          <div>
            <h4>{t('menu')}</h4>
            <ul>
              {CATEGORIES.slice(0, 5).map((c) => (
                <li key={c.key}><a href="#/">{c.emoji} {c.en}</a></li>
              ))}
            </ul>
          </div>
          <div>
            <h4>{t('needHelp')}</h4>
            <ul>
              <li><a href={'tel:' + CONFIG.PHONE_DISPLAY.replace(/\s/g, '')}><Icon name="phone" size={13} /> {CONFIG.PHONE_DISPLAY}</a></li>
              <li><Icon name="pin" size={13} /> Haldia, West Bengal</li>
              <li><Icon name="truck" size={13} /> ₹40 flat delivery</li>
              <li><Icon name="check" size={13} /> Free self-pickup</li>
            </ul>
          </div>
        </div>
        <div className="footer-bottom">
          <span>© {new Date().getFullYear()} Your Choice Family Restaurant. {t('allRights')}</span>
          <span>{t('madeWith')} 💛</span>
        </div>
      </div>
    </footer>
  );
}

/* ================================================================
   LAZY ROUTES + APP
   ================================================================ */
function lazyRoute(loader: () => any) {
  return React.lazy(() => new Promise<any>((resolve) => {
    setTimeout(() => resolve(loader()), 130);
  }));
}

const LazyCatalog = lazyRoute(() => ({ default: CatalogPage }));
const LazyProduct = lazyRoute(() => ({ default: ProductDetailPage }));
const LazyCheckout = lazyRoute(() => ({ default: CheckoutPage }));
const LazyVerify = lazyRoute(() => ({ default: VerifyPage }));
const LazyTrack = lazyRoute(() => ({ default: TrackPage }));

function PageSkeleton() {
  return (
    <div className="wrap page-skeleton">
      <div className="sk" style={{ height: 190, borderRadius: 28 }} />
      <div className="sk" style={{ height: 50, borderRadius: 16 }} />
      <div className="grid">
        {Array.from({ length: 8 }).map((_, i) => (
          <div className="card" key={i} style={{ padding: 11, display: 'grid', gap: 9 }}>
            <div className="sk" style={{ height: 96, borderRadius: 16 }} />
            <div className="sk" style={{ height: 14, width: '80%' }} />
            <div className="sk" style={{ height: 11, width: '95%' }} />
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const route = useHashRoute();
  const [cartOpen, setCartOpen] = useState(false);
  const lang = uiStore.useStore((s: any) => s.lang);

  useEffect(() => {
    let alive = true;
    api.getCatalog()
      .then((res) => { if (alive) catalogStore.setState({ products: res.products, loading: false, error: null }); })
      .catch(() => { if (alive) catalogStore.setState({ products: PRODUCTS, loading: false, error: 'fallback' }); });
    return () => { alive = false; };
  }, []);

  useEffect(() => { document.documentElement.lang = lang === 'bn' ? 'bn' : 'en'; }, [lang]);

  const parts = route.parts;
  let page: React.ReactNode;
  if (parts[0] === 'product' && parts[1]) page = <LazyProduct id={Number(parts[1])} />;
  else if (parts[0] === 'checkout') page = <LazyCheckout />;
  else if (parts[0] === 'verify' && parts[1]) page = <LazyVerify orderRef={decodeURIComponent(parts[1])} />;
  else if (parts[0] === 'track' && parts[1]) page = <LazyTrack orderRef={decodeURIComponent(parts[1])} />;
  else page = <LazyCatalog />;

  return (
    <div>
      <Header onCart={() => setCartOpen(true)} />
      <main>
        <Suspense fallback={<PageSkeleton />}>{page}</Suspense>
      </main>
      <Footer />
      <CartDrawer open={cartOpen} onClose={() => setCartOpen(false)} />
      <FloatingCart onOpen={() => setCartOpen(true)} />
      <Toaster />
    </div>
  );
}

const rootEl = document.getElementById('root');
ReactDOM.createRoot(rootEl).render(<App />);
</script>
</body>
</html>
